[project]
name = "teamscale_mcp"
version = "0.1.0"
description = "Standalone MCP server exposing the Teamscale REST API over HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.0.0",
    "uvicorn>=0.30",
]

[tool.uv]
# Single-module app; install only the dependencies (no build backend needed).
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
