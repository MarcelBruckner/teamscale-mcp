# Build the Docker image and push it to the GitLab Container Registry.
# Auth uses the built-in CI_REGISTRY_USER / CI_REGISTRY_PASSWORD job token —
# no secrets to configure.

stages: [publish]

publish:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # registry.gitlab.com/cqse/internal/teamscale-mcp
    IMAGE: $CI_REGISTRY_IMAGE
    DOCKER_BUILDKIT: "1"
  rules:
    # `v*` release tags always publish, regardless of which paths changed
    # (mirrors GitHub Actions ignoring `paths` for tag pushes).
    - if: '$CI_COMMIT_TAG =~ /^v/'
    # On the default branch, only rebuild on changes that affect the image.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "app/**/*"
        - "run-tests*.sh"
        - "Dockerfile"
        - ".dockerignore"
        - ".gitlab-ci.yml"
    # Manual run (the workflow_dispatch equivalent).
    - when: manual
      allow_failure: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder
  script:
    # Compute the tag list: sha always; `latest` only on the default branch;
    # semver (version / major.minor / major) only on a `v*` tag push.
    - |
      TAGS="--tag $IMAGE:sha-$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --tag $IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        MAJOR="${VERSION%%.*}"
        MINOR="${VERSION#*.}"; MINOR="${MINOR%%.*}"
        TAGS="$TAGS --tag $IMAGE:$VERSION --tag $IMAGE:$MAJOR.$MINOR --tag $IMAGE:$MAJOR"
      fi
      echo "Building tags: $TAGS"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --cache-from type=registry,ref=$IMAGE:buildcache \
        --cache-to type=registry,ref=$IMAGE:buildcache,mode=max \
        --push \
        $TAGS \
        .
